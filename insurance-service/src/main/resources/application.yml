spring:
  application:
    name: insurance-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/insurance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/insurance/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/insurance}
    username: ${DB_USERNAME:insurance}
    password: ${DB_PASSWORD:insurance}
    hikari:
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        max-page-size: 100
  http:
    serviceclient:
      registry:
        base-url: ${REGISTRY_BASE_URL:http://localhost:8082}
        connect-timeout: 2s
        read-timeout: 3s

server:
  port: 8081

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health

insurance:
  registration:
    retry:
      base-delay: 5s
      multiplier: 2
      max-delay: 5m
    scheduler:
      lease-duration: 30s
      poll-interval: 2s
      max-tasks-per-tick: 10
  premium:
    base-rate: 0.005
    age-factors:
      - from-age: 18
        to-age: 30
        factor: 1.0
      - from-age: 31
        to-age: 45
        factor: 1.3
      - from-age: 46
        to-age: 55
        factor: 1.7
      - from-age: 56
        to-age: 65
        factor: 2.2
